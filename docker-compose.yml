services:
  db:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    container_name: ${POSTGRES_CONTAINER_NAME:?POSTGRES_CONTAINER_NAME is required}
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:?POSTGRES_HOST_PORT is required}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ${API_IMAGE_NAME:?API_IMAGE_NAME is required}
    container_name: ${API_CONTAINER_NAME:?API_CONTAINER_NAME is required}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:?API_HOST_PORT is required}:8000"
    environment:
      DATABASE_URL: ${API_DATABASE_URL:?API_DATABASE_URL is required}
      RUN_MIGRATIONS: "true"
      DB_ECHO: ${DB_ECHO:-false}
      RUZ_BASE_URL: ${RUZ_BASE_URL:-https://ruz.spbstu.ru/api/v1/ruz/}
      RUZ_TIMEOUT: ${RUZ_TIMEOUT:-10.0}
      SPBSTU_PAY_BASE_URL: ${SPBSTU_PAY_BASE_URL:-https://pay.spbstu.ru}
      SPBSTU_PAY_TIMEOUT: ${SPBSTU_PAY_TIMEOUT:-10.0}
      SPBSTU_BASE_URL: ${SPBSTU_BASE_URL:-https://my.spbstu.ru}
      SPBSTU_TIMEOUT: ${SPBSTU_TIMEOUT:-30.0}
      SPBSTU_CONCURRENCY: ${SPBSTU_CONCURRENCY:-5}
      SPBSTU_SESSIONID: ${SPBSTU_SESSIONID:-}
      ADMISSIONS_REFRESH_INTERVAL_SECONDS: ${ADMISSIONS_REFRESH_INTERVAL_SECONDS:-900}
      ADMISSIONS_ENABLED: ${ADMISSIONS_ENABLED:-true}
      ADMISSIONS_REFRESH_ENABLED: ${ADMISSIONS_REFRESH_ENABLED:-true}
      SCHEDULE_REFRESH_INTERVAL_SECONDS: ${SCHEDULE_REFRESH_INTERVAL_SECONDS:-900}
      SCHEDULE_REFRESH_ENABLED: ${SCHEDULE_REFRESH_ENABLED:-true}
      SCHEDULE_REFRESH_CONCURRENCY: ${SCHEDULE_REFRESH_CONCURRENCY:-4}
      ACADEMIC_CALENDARS_REFRESH_INTERVAL_SECONDS: ${ACADEMIC_CALENDARS_REFRESH_INTERVAL_SECONDS:-2592000}
      ACADEMIC_CALENDARS_REFRESH_ENABLED: ${ACADEMIC_CALENDARS_REFRESH_ENABLED:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      TELEGRAM_OUTBOX_POLL_INTERVAL_SECONDS: ${TELEGRAM_OUTBOX_POLL_INTERVAL_SECONDS:-5}
      TELEGRAM_SEND_CONCURRENCY: ${TELEGRAM_SEND_CONCURRENCY:-4}
      FEEDBACK_TELEGRAM_CHAT_ID: ${FEEDBACK_TELEGRAM_CHAT_ID:-}
      USER_COOKIE_NAME: ${USER_COOKIE_NAME:-polytech_user}
      USER_COOKIE_MAX_AGE: ${USER_COOKIE_MAX_AGE:-31536000}
      USER_COOKIE_SECURE: ${USER_COOKIE_SECURE:-false}
      USER_COOKIE_SAMESITE: ${USER_COOKIE_SAMESITE:-lax}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ${API_IMAGE_NAME:?API_IMAGE_NAME is required}
    container_name: ${BOT_CONTAINER_NAME:-polytech-bot}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: ${API_DATABASE_URL:?API_DATABASE_URL is required}
      RUN_MIGRATIONS: "false"
      DB_ECHO: ${DB_ECHO:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_OUTBOX_POLL_INTERVAL_SECONDS: ${TELEGRAM_OUTBOX_POLL_INTERVAL_SECONDS:-5}
      TELEGRAM_SEND_CONCURRENCY: ${TELEGRAM_SEND_CONCURRENCY:-4}
      FEEDBACK_TELEGRAM_CHAT_ID: ${FEEDBACK_TELEGRAM_CHAT_ID:-}
    command: ["uv", "run", "--no-sync", "python", "-m", "app.bot.main"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_ADMISSIONS_ENABLED: ${ADMISSIONS_ENABLED:-true}
    image: ${FRONTEND_IMAGE_NAME:?FRONTEND_IMAGE_NAME is required}
    container_name: ${FRONTEND_CONTAINER_NAME:?FRONTEND_CONTAINER_NAME is required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:?FRONTEND_HOST_PORT is required}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: ${POSTGRES_DATA_VOLUME:?POSTGRES_DATA_VOLUME is required}
