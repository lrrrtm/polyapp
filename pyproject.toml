[project]
name = "polytech"
version = "0.1.0"
description = "FastAPI skeleton for SPbSTU schedule data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30.0",
    "alembic>=1.17.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "truststore>=0.10.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
